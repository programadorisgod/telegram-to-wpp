services:
  waha:
    image: devlikeapro/waha
    env_file: .waha.env
    environment:
      - WHATSAPP_DEFAULT_ENGINE=GOWS
    ports:
      - "127.0.0.1:3005:3000"
    volumes:
      - waha-sessions:/app/.sessions
      - waha-media:/app/.media
    restart: unless-stopped

  app:
    build: .
    profiles:
      - app
    env_file: .env
    environment:
      - WAHA_BASE_URL=http://waha:3000
    depends_on:
      - waha
    restart: unless-stopped

volumes:
  waha-sessions:
    name: project-waha-sessions
  waha-media:
    name: project-waha-media
